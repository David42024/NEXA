# Render Blueprint — backend FastAPI (soporta WebSockets para la llamada en vivo).
# Frontend se despliega en Vercel; base de datos en Neon (PostgreSQL serverless).
#
# Uso: sube este repo a GitHub y crea un Blueprint en Render apuntando a
# `render.yaml`, o crea un Web Service manual con rootDir=backend.
services:
  - type: web
    name: nexa-api
    runtime: python
    plan: free
    # Python 3.12: psycopg2-binary y pydantic-core (pinned) tienen wheels.
    # Con 3.14 Render intenta compilarlos desde fuente (Rust) y falla.
    pythonVersion: 3.12.3
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Opcional: si SEED_CSV_ON_START=1, acopla los CSV reales (backend/csvs) a la BD
    # tras el seed. Idempotente y gated por env: por defecto NO se ejecuta para no
    # alargar el arranque de cada deploy. Tambien puede correrse manualmente con:
    #   python -c "from app.services.csv_loader import seed_csv; seed_csv()"
    startCommand: alembic upgrade head && python -c "from app.seed_data import seed; seed()" && ( [ \"$SEED_CSV_ON_START\" = \"1\" ] && python -c \"from app.services.csv_loader import seed_csv; seed_csv()\" || true ) && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      # En Neon: copia la connection string del dashboard (host *.neon.tech),
      # base neondb. Agrega ?sslmode=require. Ej:
      #   postgresql://user:password@ep-xxxx-yyyy-zzzz.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Origen del frontend en Vercel, separado por coma (sin "*" en produccion).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FALLBACK_API_KEY
        sync: false
      # 1 = acopla los CSV reales (100k clientes / 300k ofrecimientos) al arrancar.
      - key: SEED_CSV_ON_START
        sync: false